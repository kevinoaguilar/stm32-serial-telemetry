name: CI
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake -S host -B build -G Ninja -DTELEMETRY_WERROR=ON

      - name: Build
        run: cmake --build build

      - name: GoogleTest
        run: ctest --test-dir build --output-on-failure
  
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure
        run: cmake -S host -B build -G Ninja -DTELEMETRY_WERROR=ON

      - name: Build
        run: cmake --build build
      
      - name: GoogleTest
        run: ctest --test-dir build --output-on-failure
  tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Allow Tsan memory layout
        run: sudo sysctl vm.mmap_rnd_bits=28
      
      - name: Configure with ThreadSanitizer (Tsan) ON
        run: cmake -S host -B build -G Ninja -DTELEMETRY_TSAN=ON

      - name: Build
        run: cmake --build build

      - name: GoogleTest
        run: ctest --test-dir build --output-on-failure
  







      
      